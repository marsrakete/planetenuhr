<template id="fictionalMissionCardTemplate">
  <section class="display-container fictional-missions-card wide-card" data-help-key="fictional_missions">
    <h2 id="fictionalMissionsTitle" class="group-title" data-fictional-copy="title"></h2>
    <div class="idefix-controls fictional-mission-tabs" data-fictional-tabs role="tablist" aria-labelledby="fictionalMissionsTitle"></div>
    <div id="fictionalMissionPanel" class="space-mission-panel" data-fictional-panel role="tabpanel" tabindex="0">
      <figure class="fictional-mission-figure">
        <div class="fictional-mission-stage" data-fictional-stage></div>
        <figcaption>
          <time data-fictional-date></time>
          <strong id="fictionalMissionSceneTitle" data-fictional-caption></strong>
        </figcaption>
      </figure>
      <dl class="fictional-mission-clocks" data-fictional-clocks hidden>
        <div><dt data-fictional-copy="landerClock"></dt><dd><time data-fictional-lander-clock></time></dd></div>
        <div><dt data-fictional-copy="enduranceClock"></dt><dd><time data-fictional-endurance-clock></time></dd></div>
      </dl>
      <div class="mission-animation-controls">
        <button type="button" class="mission-play"></button>
        <label class="mission-time-label" for="fictionalMissionTime" data-fictional-copy="time"></label>
        <input id="fictionalMissionTime" class="mission-time explorer-slider" type="range" min="0" step="any" value="0" />
      </div>
      <ol class="space-mission-timeline fictional-mission-timeline" data-fictional-timeline></ol>
      <p class="mission-animation-source" data-fictional-copy="note"></p>
    </div>
  </section>
</template>
