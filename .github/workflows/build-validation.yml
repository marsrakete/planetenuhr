name: Build Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run build validation
        run: npm run validate:repo
        env:
          TZ: Europe/Berlin

      - name: Run unit and module contract tests
        run: npm test

      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.57.0

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser regression checks
        run: npm run test:browser
        env:
          PLANETENUHR_TEST_BROWSERS: chromium,webkit
