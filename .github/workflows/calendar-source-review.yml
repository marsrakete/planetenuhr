name: Calendar Source Review

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

jobs:
  review-calendar-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Review calendar sources and coverage
        run: npm run review:calendar-sources:strict
